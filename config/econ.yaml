# Economic Outlook Lab - main configuration (read by the CLI; hooks read config/hooks.json instead).
site:
  title_vi: "Phòng Nghiên cứu Triển vọng Kinh tế"
  repo: "CompilationOfEconomicIndicators"
  data_repo: "econ-data"          # private, append-only raw store with vintages

http:
  timeout_s: 25
  truststore: true                # OS trust store (corporate TLS inspection on the dev machine)
  user_agent: "data-client/0.1"   # generic: never put personal or project details in requests

schedule:                         # documented here, enforced in .github/workflows/update-data.yml
  us_close_utc: "17 23 * * *"
  asia_close_utc: "17 9 * * 1-5"

audit:                            # token-hygiene budgets checked by `econ audit`
  claude_md_lines: 120
  agent_lines: 120
  agent_desc_chars: 220
  skill_lines: 150
  workflow_skill_lines: 60
  skill_desc_chars: 300
  rule_lines: 40
  memory_lines: 120
  handoff_lines: 30
  kb_card_lines: 80
  brief_lines: 20
  digest_lines: 60
  site_json_kb: 200
