name: deploy-site
# Build web/ and deploy to GitHub Pages. Triggers: update-data finished (its GITHUB_TOKEN push cannot trigger
# `push`), pushes to main touching web/ or published data, manual.
# Owner action needed once (not done here): Settings > Pages > Source = GitHub Actions.
on:
  workflow_run:
    workflows: [update-data]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "web/**"
      - "ledger/health.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_run fires on failure too: only deploy after a successful data update.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployable: ${{ steps.web.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check web project
        id: web
        run: |
          if [ -f web/package-lock.json ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::web/package-lock.json missing - nothing to deploy (run npm install in web/ and commit the lockfile)"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.web.outputs.ok == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.web.outputs.ok == 'true'
      - name: Build
        if: steps.web.outputs.ok == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.web.outputs.ok == 'true'
        with:
          path: web/dist

  deploy:
    needs: build
    if: needs.build.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
