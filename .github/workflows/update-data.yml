name: update-data
# Daily data refresh: fetch -> compute -> forecast -> ledger -> publish -> commit -> (deploy-site via workflow_run).
# Schedule mirrors config/econ.yaml `schedule` (enforced by tests/test_e2e_slice.py).
#
# ASK (Owner): the raw store lives in the private repo `econ-data`. Restoring it needs a token with read access
# (and write access to persist new vintages). This workflow uses the secret DATA_REPO_TOKEN ONLY IF it already
# exists (fine-grained PAT, contents:write on econ-data only; see .claude/rules/ci-workflows.md). If it does not,
# the restore/persist steps are skipped with a log line and `update` runs on an empty store (fetch backfills from
# FRED_API_KEY; the quality/health output will show degraded sources). No other secret is introduced.
on:
  schedule:
    - cron: "17 23 * * *"
    - cron: "17 9 * * 1-5"
  workflow_dispatch:
    inputs:
      asof:
        description: "As-of date YYYY-MM-DD (empty = today UTC)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # commit ledger/ + web/public/data with the workflow bot
    env:
      PYTHONUTF8: "1"
      ECON_NO_VENV: "1"
      ECON_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Restore raw store from econ-data
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "::notice::DATA_REPO_TOKEN not configured - skipping econ-data restore (update runs on an empty store)"
            mkdir -p data
          else
            git clone --quiet --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${OWNER}/econ-data.git" data
            echo "restored econ-data ($(git -C data rev-parse --short HEAD))"
          fi

      - name: Update (fetch, compute, forecast, ledger, publish)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ASOF: ${{ inputs.asof }}
        run: |
          if [ -n "$ASOF" ]; then python econ.py update --asof "$ASOF"; else python econ.py update; fi

      - name: Verify ledger is append-only
        run: python econ.py ledger verify

      - name: License scan of published JSON
        run: python econ.py publish --scan

      - name: Persist new vintages to econ-data
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "::notice::DATA_REPO_TOKEN not configured - new vintages are NOT persisted"
            exit 0
          fi
          cd data
          git add -A
          if git diff --cached --quiet; then echo "no new vintages"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "data: vintages $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet

      - name: Commit ledger and site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # web/public/data is gitignored for local work; CI force-adds it (and stages removals of old hashed files).
          git add -A ledger
          git add -A -f web/public/data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit --quiet -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
          git push --quiet origin "HEAD:${GITHUB_REF_NAME}"
      # GITHUB_TOKEN pushes do not trigger other workflows: deploy-site.yml runs via workflow_run on this one.
